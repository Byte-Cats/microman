apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      name: microman
  template:
    metadata:
      labels:
        name: microman
    spec:
      containers:
      - name: microman
        image: microman/deployment
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 6969
        env:
        - name: PORT
          value: "6969"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
      restartPolicy: Always
