basePath: /
definitions:
  data.Item:
    properties:
      id:
        type: integer
      name:
        type: string
      value:
        type: string
    type: object
  handlers.AddRequest:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
  handlers.DeleteResponse:
    properties:
      deleted:
        type: boolean
      id:
        type: integer
    type: object
  handlers.EditRequest:
    properties:
      name:
        type: string
      value:
        type: string
    type: object
host: localhost:6969
info:
  contact:
    name: Byte Cats
    url: https://github.com/Byte-Cats/microman
  description: Minimal Go HTTP API starter kit (no web framework) built on net/http
    and gorilla/mux. Most routes are still stub handlers; see the /docs endpoint and
    each handler's doc comment for the actual current behavior.
  license:
    name: MIT
    url: https://github.com/Byte-Cats/microman/blob/main/LICENCE
  termsOfService: http://swagger.io/terms/
  title: Microman API
  version: 0.420.69
paths:
  /:
    get:
      description: Redirects the client from the root path to /docs with a 303 See
        Other.
      responses:
        "303":
          description: redirect to /docs
          schema:
            type: string
      summary: Redirect to docs
      tags:
      - general
  /add:
    post:
      consumes:
      - application/json
      description: Creates a new row in the items table (see data/schema.sql) from
        a JSON body and returns the created item, including its generated id. Real
        MySQL-backed CRUD via the data package, demonstrating database wiring rather
        than a stub response.
      parameters:
      - description: Item to create
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/handlers.AddRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/data.Item'
        "400":
          description: invalid request body
          schema:
            type: string
        "500":
          description: database error
          schema:
            type: string
      summary: Add an item
      tags:
      - rest
  /delete:
    delete:
      description: Deletes the row in the items table (see data/schema.sql) identified
        by the `id` query parameter and confirms deletion as JSON. Real MySQL-backed
        CRUD via the data package, demonstrating database wiring rather than a stub
        response.
      parameters:
      - description: Item id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DeleteResponse'
        "400":
          description: missing or invalid id
          schema:
            type: string
        "404":
          description: item not found
          schema:
            type: string
        "500":
          description: database error
          schema:
            type: string
      summary: Delete an item
      tags:
      - rest
  /docs:
    get:
      description: Writes a fixed "Docs" string. Real interactive API docs are served
        separately by the Swagger UI mounted at /swagger/.
      produces:
      - text/plain
      responses:
        "200":
          description: Docs
          schema:
            type: string
      summary: Docs placeholder
      tags:
      - general
  /edit:
    put:
      consumes:
      - application/json
      description: Updates the name/value of the row in the items table (see data/schema.sql)
        identified by the `id` query parameter, from a JSON body, and returns the
        updated item. Real MySQL-backed CRUD via the data package, demonstrating database
        wiring rather than a stub response.
      parameters:
      - description: Item id
        in: query
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/handlers.EditRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.Item'
        "400":
          description: missing/invalid id or request body
          schema:
            type: string
        "404":
          description: item not found
          schema:
            type: string
        "500":
          description: database error
          schema:
            type: string
      summary: Edit an item
      tags:
      - rest
  /get:
    get:
      description: Fetches a single row from the items table (see data/schema.sql)
        by its id, passed as the `id` query parameter, and returns it as JSON. Real
        MySQL-backed CRUD via the data package, demonstrating database wiring rather
        than a stub response.
      parameters:
      - description: Item id
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/data.Item'
        "400":
          description: missing or invalid id
          schema:
            type: string
        "404":
          description: item not found
          schema:
            type: string
        "500":
          description: database error
          schema:
            type: string
      summary: Get an item
      tags:
      - rest
  /home:
    get:
      description: Writes a fixed welcome message for the microman API and logs the
        request.
      produces:
      - text/plain
      responses:
        "200":
          description: welcome message
          schema:
            type: string
      summary: Home page
      tags:
      - general
  /info:
    get:
      description: Writes a fixed informational string describing this endpoint.
      produces:
      - text/plain
      responses:
        "200":
          description: info string
          schema:
            type: string
      summary: Info page
      tags:
      - general
swagger: "2.0"
